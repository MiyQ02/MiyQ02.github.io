<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="title">滅Q - 關於</title>

    <style>
        html.language-loading body {
            visibility: hidden;
        }
    </style>

    <script>
    (function () {
        const lang = localStorage.getItem('lang');

        if (lang === 'en' || lang === 'ja') {
            document.documentElement.classList.add('language-loading');
        }
    })();
    </script>

    <script>
        (function() {
            let themeClass = localStorage.getItem('theme');
            if (!themeClass) {
                themeClass = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-theme' : 'light-theme';
            } else {
                themeClass = themeClass === 'dark' ? 'dark-theme' : 'light-theme';
            }
            document.documentElement.classList.add(themeClass);
        })();
    </script>

<script>
(function () {
    const isMobilePage = location.pathname.split('/').pop().endsWith('_mobile.html');
    const currentName = location.pathname.split('/').pop();

    const desktopToMobile = {
        'index.html': 'index_mobile.html',
        'gallery.html': 'gallery_mobile.html',
        'about.html': 'about_mobile.html'
    };
    const mobileToDesktop = {
        'index_mobile.html': 'index.html',
        'gallery_mobile.html': 'gallery.html',
        'about_mobile.html': 'about.html'
    };

    function syncPageByViewport() {
        const isMobileViewport = window.matchMedia('(max-width: 760px)').matches;
        const target = isMobileViewport
            ? desktopToMobile[currentName]
            : mobileToDesktop[currentName];

        if (target && (isMobileViewport !== isMobilePage)) {
            location.replace(target);
        }
    }

    syncPageByViewport();

    const mediaQuery = window.matchMedia('(max-width: 760px)');
    if (mediaQuery.addEventListener) {
        mediaQuery.addEventListener('change', syncPageByViewport);
    } else {
        mediaQuery.addListener(syncPageByViewport);
    }
})();
</script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="mobile-site-page mobile-about-page">

<script>
const themeToggle = document.getElementById('theme-toggle');
const langSelect = document.getElementById('lang-select');
const themeButtons = [themeToggle].filter(Boolean);
const languageSelects = [langSelect].filter(Boolean);

const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
const mobileMenuDrawer = document.getElementById('mobile-menu-drawer');
const mobileMenuClose = document.getElementById('mobile-menu-close');
const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');

function closeMobileMenu() {
    if (!mobileMenuDrawer) return;
    mobileMenuDrawer.classList.remove('is-open');
    mobileMenuDrawer.setAttribute('aria-hidden', 'true');
    mobileMenuToggle?.setAttribute('aria-expanded', 'false');
    if (mobileMenuOverlay) mobileMenuOverlay.hidden = true;
    document.body.classList.remove('drawer-open');
}

function openMobileMenu() {
    mobileMenuDrawer?.classList.add('is-open');
    mobileMenuDrawer?.setAttribute('aria-hidden', 'false');
    mobileMenuToggle?.setAttribute('aria-expanded', 'true');
    if (mobileMenuOverlay) mobileMenuOverlay.hidden = false;
    document.body.classList.add('drawer-open');
}

mobileMenuToggle?.addEventListener('click', openMobileMenu);
mobileMenuClose?.addEventListener('click', closeMobileMenu);
mobileMenuOverlay?.addEventListener('click', closeMobileMenu);

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMobileMenu();
});

function applyStoredTheme(themeName) {
    const isDark = themeName === 'dark';
    document.documentElement.classList.remove('light-theme', 'dark-theme');
    document.documentElement.classList.add(isDark ? 'dark-theme' : 'light-theme');
    document.body.classList.toggle('dark-theme', isDark);

    themeButtons.forEach((button) => {
        button.textContent = isDark ? '☀️' : '🌙';
        button.setAttribute('aria-label', isDark ? '切換為白天模式' : '切換為黑夜模式');
    });
}

function applyStoredLanguage(languageCode) {
    const normalized = ['en', 'ja'].includes(languageCode) ? languageCode : 'zh-TW';
    document.documentElement.style.setProperty(
        '--lang-flag-url',
        `url("${normalized === 'en' ? './img/other/USA.svg' : normalized === 'ja' ? './img/other/JP.svg' : './img/other/TW.svg'}")`
    );
    languageSelects.forEach((select) => select.value = normalized);
    if (typeof updatePageLanguage === 'function') updatePageLanguage(normalized);
}

function syncGlobalControls() {
    try {
        let savedTheme = localStorage.getItem('theme');
        if (!savedTheme) savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        applyStoredTheme(savedTheme);
        applyStoredLanguage(localStorage.getItem('lang') || 'zh-TW');
    } catch (error) {
        applyStoredTheme('light');
        applyStoredLanguage('zh-TW');
    }
}

themeButtons.forEach((button) => button.addEventListener('click', () => {
    const nextTheme = document.documentElement.classList.contains('dark-theme') ? 'light' : 'dark';
    try { localStorage.setItem('theme', nextTheme); } catch (error) {}
    applyStoredTheme(nextTheme);
}));

languageSelects.forEach((select) => select.addEventListener('change', (event) => {
    const nextLanguage = ['en', 'ja'].includes(event.target.value) ? event.target.value : 'zh-TW';
    try { localStorage.setItem('lang', nextLanguage); } catch (error) {}
    applyStoredLanguage(nextLanguage);
}));

const i18nData = {
    'zh-TW': {
        'title': '滅Q - 關於',
        'nav-home': '首頁',
        'nav-gallery': '繪畫',
        'nav-about': '關於',
        'mobile-menu': '選單',
        'profile-role': '畫畫蠻好玩的',
        'about-heading': '個人簡介',
        'about-p1': '魚好吃，但是吃多了會膩',
        'about-p2': '如果你跟我一樣，在小學時因為看了含有偽娘元素的動畫，而喜歡上了二次元的偽娘，那你的人生跟我一樣，已經毀了......',
        'skills-heading': '業餘技能',
        'skill-drawing': '畫畫',
        'skill-nonsense': '講廢話',
        'links-heading': '外部連結',
        'link-twitter': '推特',
        'profile-alt': '個人頭像'
    },
    'en': {
        'title': '滅Q - About',
        'nav-home': 'Home',
        'nav-gallery': 'Gallery',
        'nav-about': 'About',
        'mobile-menu': 'Menu',
        'profile-role': 'Drawing is pretty fun',
        'about-heading': 'About Me',
        'about-p1': 'Fish tastes good, but too much gets boring.',
        'about-p2': 'If you are like me, and you fell in love with anime-style femboys because you watched an anime with a femboy character in elementary school, then your life is already ruined, just like mine......',
        'skills-heading': 'Hobby Skills',
        'skill-drawing': 'Drawing',
        'skill-nonsense': 'Talking nonsense',
        'links-heading': 'External Links',
        'link-twitter': 'Twitter',
        'profile-alt': 'Profile avatar',
    },
    'ja': {
        'title': '滅Q - プロフィール',
        'nav-home': 'ホーム',
        'nav-gallery': 'ギャラリー',
        'nav-about': 'プロフィール',
        'mobile-menu': 'メニュー',
        'profile-role': '絵を描くのはけっこう楽しい',
        'about-heading': 'プロフィール',
        'about-p1': '魚はおいしいけど、食べすぎると飽きる。',
        'about-p2': 'もしあなたも僕と同じように、小学生の頃に男の娘要素のあるアニメを見て、二次元の男の娘が好きになったのなら、あなたの人生も僕と同じように、もう終わっています……',
        'skills-heading': '趣味のスキル',
        'skill-drawing': 'お絵描き',
        'skill-nonsense': 'くだらない話をする',
        'links-heading': '外部リンク',
        'link-twitter': 'Twitter',
        'profile-alt': 'プロフィール画像',

    }
};

function updatePageLanguage(lang) {
    const validLang = i18nData[lang] ? lang : 'zh-TW';
    const data = i18nData[validLang];
    
    document.documentElement.lang = validLang;
    
    // 動態更新網頁標題
    if (data['_title'] !== undefined) {
        document.title = data['_title'];
    }
    
    // 翻譯文字內容
    document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.getAttribute('data-i18n');
        if (data[key] !== undefined) {
            element.textContent = data[key];
        }
    });
    
    // 翻譯圖片替代文字
    document.querySelectorAll('[data-i18n-attr]').forEach((element) => {
        const key = element.getAttribute('data-i18n-attr');
        if (data[key] !== undefined) {
            element.setAttribute('alt', data[key]);
        }
    });

    document.documentElement.lang =
        lang === 'ja'
            ? 'ja'
            : lang === 'en'
                ? 'en'
                : 'zh-TW';    
    
    document.documentElement.classList.remove('language-loading');
}

document.addEventListener('DOMContentLoaded', syncGlobalControls);
</script>
</html>
