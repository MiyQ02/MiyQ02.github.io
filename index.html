    <script>
    (function () {

        if (lang === 'en' || lang === 'ja') {
            document.documentElement.classList.add('language-loading');

    })();
    </script>

    <!-- 鎖定防閾爆（Anti-Flicker）的內联脚本，在所有上伸的資源加載前執行 -->
    <script>
        (function() {
            // 優先咪取 localStorage 的主題設定，次之依賴系統偏好
            let themeClass = localStorage.getItem('theme');
            
            if (!themeClass) {
                // 孖測系統偏好，但不墨記存
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                themeClass = prefersDark ? 'dark-theme' : 'light-theme';
            } else {
                // localStorage 中存的是 'dark' 或 'light'，需要轉換為 class 名
                themeClass = themeClass === 'dark' ? 'dark-theme' : 'light-theme';
            }
            
            // 立即應用到 <html> 元素，在駨查器上設之前完成
            document.documentElement.classList.add(themeClass);
        })();
    </script>
    
<script>
(function () {
    const currentName = location.pathname.split('/').pop() || 'index.html';
    const isMobilePage = currentName.endsWith('_mobile.html');

    const desktopToMobile = {
        'index.html': 'index_mobile.html',
        'gallery.html': 'gallery_mobile.html',
        'manga.html': 'manga_mobile.html',
        'about.html': 'about_mobile.html',
        'download.html': 'download_mobile.html'
    };

    const mobileToDesktop = {
        'index_mobile.html': 'index.html',
        'gallery_mobile.html': 'gallery.html',
        'manga_mobile.html': 'manga.html',
        'about_mobile.html': 'about.html',
        'download_mobile.html': 'download.html'
    };

    function syncPageByViewport() {
        const isMobileViewport =
            window.matchMedia('(max-width: 760px)').matches;

        const target = isMobileViewport
            ? desktopToMobile[currentName]
            : mobileToDesktop[currentName];

        if (target && (isMobileViewport !== isMobilePage)) {
            location.replace(target);
        }
    }

    syncPageByViewport();

    const mediaQuery = window.matchMedia('(max-width: 760px)');

    if (mediaQuery.addEventListener) {
        mediaQuery.addEventListener('change', syncPageByViewport);
    } else {
        mediaQuery.addListener(syncPageByViewport);
    }
})();
</script>

    <script>
    // 首幀前套用游標集與已快取的縮放尺寸：自訂游標（含大小）從第一幀就生效
    (function () {
        try {
            var s = localStorage.getItem('cursor-set');
            if (!(s && s !== 'default' && /^(Chito|Yuuri|Shijima|Majime|Big_Sis)\/(no_border|white_border)$/.test(s))) {
                return;
            }
            document.documentElement.setAttribute('data-cursor', s);
            var scale = parseInt(localStorage.getItem('cursor-scale'), 10);
            // 對齊四檔（預設/小/中/大=100/125/150/200），夾住 200 上限
            var CHOICES = [100, 125, 150, 200];
            if (scale && scale !== 100) {
                var bounded = Math.min(200, Math.max(100, scale));
                var best = 100, bestDiff = Infinity;
                for (var i = 0; i < CHOICES.length; i++) {
                    var diff = Math.abs(bounded - CHOICES[i]);
                    if (diff < bestDiff) { best = CHOICES[i]; bestDiff = diff; }
                }
                scale = best;
            }
            if (scale && scale !== 100) {
                var cssCache = JSON.parse(localStorage.getItem('cursorCssCacheV2') || '{}');
                var css = cssCache[s + '|' + scale];
                if (css) {
                    var st = document.createElement('style');
                    st.id = 'cursor-scale-style';
                    st.textContent = css;
                    document.head.appendChild(st);
                }
            }
        } catch (e) { /* 無痕模式：跳過 */ }
    })();
    </script>

<script>
// 全域翻譯資料

        'home-title': 'Web【Taiwan】',
        'home-explain': '"The English and Japanese versions of this website are translated by AI tools."',
    },
    'ja': {
        'title': '滅Q - ホーム',
        'license-note': 'ソースコードは MIT ライセンスです（改変・商用利用可。レイアウトの参考は歓迎ですが、内容と画像はご自身のものに置き換えてください）。イラスト・挿絵・カーソル等の作品および本サイトのビジュアルデザインは © 滅Q (MiyQ) で、CC BY-NC-ND 4.0（クレジット表記必須・商用不可・改作不可）に従い、AI モデルの学習用データとしての使用を禁止します。',
        'license-link': 'ライセンス',
        'nav-home': 'ホーム',
        'nav-gallery': 'ギャラリー',
        'nav-manga': '漫画',
        'nav-about': 'プロフィール',
        'nav-download': 'ダウンロード',
        'cursor-settings': 'カーソル設定',
        'home-title': 'Web【台湾】',
        'home-explain': '「本サイトの英語と日本語はAIツールで翻訳されています。」'
    }
};

function updatePageLanguage(lang) {
    document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.getAttribute('data-i18n');
        if (i18nData[lang] && i18nData[lang][key]) {
            element.textContent = i18nData[lang][key];
        }
    });

    document.documentElement.lang =
        lang === 'ja'
            ? 'ja'
            : lang === 'en'
                ? 'en'
                : 'zh-TW';

    document.documentElement.classList.remove('language-loading');
}

const themeToggle = document.getElementById('theme-toggle');
const themeToggleMobile = document.getElementById('theme-toggle-mobile');
const langSelect = document.getElementById('lang-select');
const langSelectMobile = document.getElementById('lang-select-mobile');

const themeButtons = [themeToggle, themeToggleMobile].filter(Boolean);
const languageSelects = [langSelect, langSelectMobile].filter(Boolean);

function applyStoredTheme(themeName) {
    const isDark = themeName === 'dark';
    const themeClass = isDark ? 'dark-theme' : 'light-theme';
    
    // 在 html 元素上設置主題（防閃爍）
    document.documentElement.classList.remove('light-theme', 'dark-theme');
    document.documentElement.classList.add(themeClass);
    
    // 相容性：也在 body 上設置
    document.body.classList.toggle('dark-theme', isDark);
    
    themeButtons.forEach((button) => {
        button.textContent = isDark ? '☀️' : '🌙';
        button.setAttribute('aria-label', isDark ? '切換為白天模式' : '切換為黑夜模式');
    });
}

function applyStoredLanguage(languageCode) {
    const normalized = ['en', 'ja'].includes(languageCode) ? languageCode : 'zh-TW';
    const selectedFlag = normalized === 'en' ? './img/other/USA.svg' : normalized === 'ja' ? './img/other/JP.svg' : './img/other/TW.svg';

    document.documentElement.style.setProperty('--lang-flag-url', `url("${selectedFlag}")`);

    languageSelects.forEach((select) => {
        if (select) {
            select.value = normalized;
        }
    });
    // 更新頁面內容文字
    if (typeof updatePageLanguage === 'function') {
        updatePageLanguage(normalized);
    }
}

function syncGlobalControls() {
    try {
        let savedTheme = localStorage.getItem('theme');
        
        // 如果沒有儲存過主題，則根據系統偏好自動設定
        if (!savedTheme) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            savedTheme = prefersDark ? 'dark' : 'light';
        }
        
        const savedLanguage = localStorage.getItem('lang') || 'zh-TW';
        applyStoredTheme(savedTheme);
        applyStoredLanguage(savedLanguage);
    } catch (error) {
        applyStoredTheme('light');
        applyStoredLanguage('zh-TW');
    }
}

themeButtons.forEach((button) => {
    button.addEventListener('click', () => {
        const nextTheme = document.documentElement.classList.contains('dark-theme') ? 'light' : 'dark';
        try {
            localStorage.setItem('theme', nextTheme);
        } catch (error) {
            // 忽略儲存失敗，保留前端預設值。
        }
        applyStoredTheme(nextTheme);
    });
});

languageSelects.forEach((select) => {
    select.addEventListener('change', (event) => {
        const nextLanguage = ['en', 'ja'].includes(event.target.value) ? event.target.value : 'zh-TW';
        try {
            localStorage.setItem('lang', nextLanguage);
        } catch (error) {
            // 忽略儲存失敗，保留前端預設值。
        }
        applyStoredLanguage(nextLanguage);
    });
});

document.addEventListener('DOMContentLoaded', syncGlobalControls);

// 處理圖片點擊放大燈箱、滑鼠滾輪縮放與滑鼠左鍵拖曳移動圖片的完整邏輯

const triggerImage = document.getElementById('trigger-img');
const lightboxModal = document.getElementById('lightbox-modal');
const closeButton = document.querySelector('.close-btn');
const imageWrapper = document.getElementById('img-wrapper');
const lightboxImage = document.getElementById('lightbox-img');

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let touchMode = '';
let pinchStartDistance = 0;
let pinchStartScale = 1;
let startX = 0;
let startY = 0;

function updateImageTransform() {
    imageWrapper.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    lightboxImage.style.transform = `scale(${scale})`;
}

function zoomAtPoint(nextScale, clientX, clientY) {
    const previousScale = scale;
    const clampedScale = Math.min(Math.max(nextScale, 0.5), 4);
    const pointX = clientX - window.innerWidth / 2;
    const pointY = clientY - window.innerHeight / 2;

    offsetX = pointX - (pointX - offsetX) * clampedScale / previousScale;
    offsetY = pointY - (pointY - offsetY) * clampedScale / previousScale;
    scale = clampedScale;
    updateImageTransform();
}

function getTouchDistance(firstTouch, secondTouch) {
    return Math.hypot(
        secondTouch.clientX - firstTouch.clientX,
        secondTouch.clientY - firstTouch.clientY
    );
}

function getTouchCenter(firstTouch, secondTouch) {
    return {
        x: (firstTouch.clientX + secondTouch.clientX) / 2,
        y: (firstTouch.clientY + secondTouch.clientY) / 2
    };
}

function openLightbox() {
    const fullSrc = triggerImage.dataset.fullSrc;
    if (fullSrc) {
        lightboxImage.src = fullSrc;
    } else {
        lightboxImage.src = triggerImage.src;
    }
    lightboxImage.alt = triggerImage.alt;
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    updateImageTransform();
    lightboxModal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    lightboxModal.style.display = 'none';
    document.body.style.overflow = '';
    isDragging = false;
}

triggerImage.addEventListener('click', openLightbox);
closeButton.addEventListener('click', closeLightbox);

lightboxModal.addEventListener('click', (event) => {
    if (event.target === lightboxModal) {
        closeLightbox();
    }
});

lightboxModal.addEventListener('wheel', (event) => {
    event.preventDefault();
    zoomAtPoint(scale + (event.deltaY < 0 ? 0.1 : -0.1), event.clientX, event.clientY);
}, { passive: false });

imageWrapper.addEventListener('mousedown', (event) => {
    if (event.button !== 0) {
        return;
    }

    isDragging = true;
    startX = event.clientX - offsetX;
    startY = event.clientY - offsetY;
    event.preventDefault();
});

document.addEventListener('mousemove', (event) => {
    if (!isDragging) {
        return;
    }

    offsetX = event.clientX - startX;
    offsetY = event.clientY - startY;
    updateImageTransform();
});

document.addEventListener('mouseup', () => {
    isDragging = false;
});

imageWrapper.addEventListener('touchstart', (event) => {
    event.preventDefault();
    if (event.touches.length === 2) {
        touchMode = 'pinch';
        pinchStartDistance = getTouchDistance(event.touches[0], event.touches[1]);
        pinchStartScale = scale;
    } else if (event.touches.length === 1) {
        touchMode = 'drag';
        startX = event.touches[0].clientX - offsetX;
        startY = event.touches[0].clientY - offsetY;
    }
}, { passive: false });

imageWrapper.addEventListener('touchmove', (event) => {
    event.preventDefault();
    if (event.touches.length === 2) {
        if (touchMode !== 'pinch') {
            touchMode = 'pinch';
            pinchStartDistance = getTouchDistance(event.touches[0], event.touches[1]);
            pinchStartScale = scale;
        }

        const currentDistance = getTouchDistance(event.touches[0], event.touches[1]);
        const currentCenter = getTouchCenter(event.touches[0], event.touches[1]);
        zoomAtPoint(
            pinchStartScale * currentDistance / pinchStartDistance,
            currentCenter.x,
            currentCenter.y
        );
    } else if (event.touches.length === 1 && touchMode === 'drag') {
        offsetX = event.touches[0].clientX - startX;
        offsetY = event.touches[0].clientY - startY;
        updateImageTransform();
    }
}, { passive: false });

imageWrapper.addEventListener('touchend', (event) => {
    if (event.touches.length === 0) {
        touchMode = '';
        return;
    }

    if (event.touches.length === 1) {
        touchMode = 'drag';
        startX = event.touches[0].clientX - offsetX;
        startY = event.touches[0].clientY - offsetY;
    }
});

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && lightboxModal.style.display === 'flex') {
        closeLightbox();
    }
});
</script>
