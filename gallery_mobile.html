    <!-- 鎖定防閃爍（Anti-Flicker）的內聯腳本，在所有上伸的資源加載前執行 -->
    <script>
        (function() {
            // 優先啟取 localStorage 的主題設定，次之依賴系統偏好
            let themeClass = localStorage.getItem('theme');
            
            if (!themeClass) {
                // 偵測系統偏好，但不隸記存
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                themeClass = prefersDark ? 'dark-theme' : 'light-theme';
            } else {
                // localStorage 中存的是 'dark' 或 'light'，需要轉換為 class 名
                themeClass = themeClass === 'dark' ? 'dark-theme' : 'light-theme';
            }
            
            // 立即應用到 <html> 元素，在瀏覽器上設之前完成
            document.documentElement.classList.add(themeClass);
        })();
    </script>
    
<script>
(function () {
    const isMobilePage = location.pathname.split('/').pop().endsWith('_mobile.html');
    const currentName = location.pathname.split('/').pop();

    const desktopToMobile = {
        'index.html': 'index_mobile.html',
        'gallery.html': 'gallery_mobile.html',
        'about.html': 'about_mobile.html'
    };
    const mobileToDesktop = {
        'index_mobile.html': 'index.html',
        'gallery_mobile.html': 'gallery.html',
        'about_mobile.html': 'about.html'
    };

    function syncPageByViewport() {
        const isMobileViewport = window.matchMedia('(max-width: 760px)').matches;
        const target = isMobileViewport
            ? desktopToMobile[currentName]
            : mobileToDesktop[currentName];

        if (target && (isMobileViewport !== isMobilePage)) {
            location.replace(target);
        }
    }

    syncPageByViewport();

    const mediaQuery = window.matchMedia('(max-width: 760px)');
    if (mediaQuery.addEventListener) {
        mediaQuery.addEventListener('change', syncPageByViewport);
    } else {
        mediaQuery.addListener(syncPageByViewport);
    }
})();
</script>

<script>
const themeToggle = document.getElementById('theme-toggle');
const langSelect = document.getElementById('lang-select');
const themeButtons = [themeToggle].filter(Boolean);
const languageSelects = [langSelect].filter(Boolean);

const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
const mobileMenuDrawer = document.getElementById('mobile-menu-drawer');
const mobileMenuClose = document.getElementById('mobile-menu-close');
const yearSettingsToggle = document.getElementById('year-settings-toggle');
const yearSettingsDrawer = document.getElementById('year-settings-drawer');
const yearSettingsClose = document.getElementById('year-settings-close');
const mobileDrawerOverlay = document.getElementById('mobile-drawer-overlay');

function closeMobileDrawers() {
    [mobileMenuDrawer, yearSettingsDrawer].forEach((drawer) => {
        if (!drawer) return;
        drawer.classList.remove('is-open');
        drawer.setAttribute('aria-hidden', 'true');
    });
    [mobileMenuToggle, yearSettingsToggle].forEach((button) => {
        if (button) button.setAttribute('aria-expanded', 'false');
    });
    if (mobileDrawerOverlay) mobileDrawerOverlay.hidden = true;
    document.body.classList.remove('drawer-open');
}

function openMobileDrawer(drawer, trigger) {
    if (!drawer || !trigger) return;
    closeMobileDrawers();
    drawer.classList.add('is-open');
    drawer.setAttribute('aria-hidden', 'false');
    trigger.setAttribute('aria-expanded', 'true');
    mobileDrawerOverlay.hidden = false;
    document.body.classList.add('drawer-open');
}

mobileMenuToggle.addEventListener('click', () => openMobileDrawer(mobileMenuDrawer, mobileMenuToggle));
mobileMenuClose.addEventListener('click', closeMobileDrawers);
yearSettingsToggle.addEventListener('click', () => openMobileDrawer(yearSettingsDrawer, yearSettingsToggle));
yearSettingsClose.addEventListener('click', closeMobileDrawers);
mobileDrawerOverlay.addEventListener('click', closeMobileDrawers);

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMobileDrawers();
});

function applyStoredTheme(themeName) {
    const isDark = themeName === 'dark';
    const themeClass = isDark ? 'dark-theme' : 'light-theme';
    
    // 在 html 元素上設置主題（防閃爍）
    document.documentElement.classList.remove('light-theme', 'dark-theme');
    document.documentElement.classList.add(themeClass);
    
    // 相容性：也在 body 上設置
    document.body.classList.toggle('dark-theme', isDark);
    
    themeButtons.forEach((button) => {
        button.textContent = isDark ? '☀️' : '🌙';
        button.setAttribute('aria-label', isDark ? '切換為白天模式' : '切換為黑夜模式');
    });
}

function applyStoredLanguage(languageCode) {
    const normalized = ['en', 'ja'].includes(languageCode) ? languageCode : 'zh-TW';
    const selectedFlag = normalized === 'en' ? './img/other/USA.svg' : normalized === 'ja' ? './img/other/JP.svg' : './img/other/TW.svg';

    document.documentElement.style.setProperty('--lang-flag-url', `url("${selectedFlag}")`);

    languageSelects.forEach((select) => {
        if (select) {
            select.value = normalized;
        }
    });
    // 更新頁面內容文字
    if (typeof updatePageLanguage === 'function') {
        updatePageLanguage(normalized);
    }
}

function syncGlobalControls() {
    try {
        let savedTheme = localStorage.getItem('theme');
        
        // 如果沒有儲存過主題，則根據系統偏好自動設定
        if (!savedTheme) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            savedTheme = prefersDark ? 'dark' : 'light';
        }
        
        const savedLanguage = localStorage.getItem('lang') || 'zh-TW';
        applyStoredTheme(savedTheme);
        applyStoredLanguage(savedLanguage);
    } catch (error) {
        applyStoredTheme('light');
        applyStoredLanguage('zh-TW');
    }
}

themeButtons.forEach((button) => {
    button.addEventListener('click', () => {
        const nextTheme = document.documentElement.classList.contains('dark-theme') ? 'light' : 'dark';
        try {
            localStorage.setItem('theme', nextTheme);
        } catch (error) {
            // 忽略儲存失敗，保留前端預設值。
        }
        applyStoredTheme(nextTheme);
    });
});

languageSelects.forEach((select) => {
    select.addEventListener('change', (event) => {
        const nextLanguage = ['en', 'ja'].includes(event.target.value) ? event.target.value : 'zh-TW';
        try {
            localStorage.setItem('lang', nextLanguage);
        } catch (error) {
            // 忽略儲存失敗，保留前端預設值。
        }
        applyStoredLanguage(nextLanguage);
    });
});

document.addEventListener('DOMContentLoaded', syncGlobalControls);

const GALLERY_HISTORY_KEY = 'galleryView';
const GALLERY_PAGE_KEY = 'galleryPage';

/*
 * Gallery 的 History 狀態只有三種：
 * list  → 作品列表
 * card  → 作品資訊卡
 * image → 原圖查看
 *
 * 注意：首頁等其他頁面沒有 galleryPage，因此不能把「沒有 state」誤判成 list。
 */
function replaceGalleryHistory(view) {
    history.replaceState(
        {
            ...(history.state || {}),
            [GALLERY_PAGE_KEY]: true,
            [GALLERY_HISTORY_KEY]: view
        },
        '',
        location.href
    );
}

function pushGalleryHistory(view) {
    history.pushState(
        {
            ...(history.state || {}),
            [GALLERY_PAGE_KEY]: true,
            [GALLERY_HISTORY_KEY]: view
        },
        '',
        location.href
    );
}

// 目前頁面本身就是 Gallery 的列表狀態。
replaceGalleryHistory('list');

window.addEventListener('popstate', (event) => {
    const state = event.state || {};

    // 已經離開 Gallery（例如回到首頁），不要把它誤判成 list。
    if (state[GALLERY_PAGE_KEY] !== true) {
        return;
    }

    const view = state[GALLERY_HISTORY_KEY];

    if (view === 'image') {
        // 支援瀏覽器前進：card → image
        if (galleryModal.getAttribute('aria-hidden') === 'false') {
            galleryIsInteractive = true;
            galleryInfo.hidden = true;
            galleryModal.classList.add('is-interactive', 'zoom-active');
            updateGalleryTransform();
        }
        return;
    }

    if (view === 'card') {
        // image → card
        if (galleryModal.getAttribute('aria-hidden') === 'false') {
            returnToGalleryCard();
        }
        return;
    }

    if (view === 'list') {
        // card → list
        if (galleryModal.getAttribute('aria-hidden') === 'false') {
            closeGalleryLightbox();
        }
    }
});

function createWorks(start, end, year) {
    return Array.from(
        { length: end - start + 1 },
        (_, index) => ({
            filename: String(start + index),
            year: String(year)
        })
    );
}

// 建立各年份作品資料。
const works = [
    ...createWorks(128, 139, 2026),
    { filename: '128-2', year: '2026', extension: '.png' },
    { filename: '130-2', year: '2026', extension: '.png' },

    ...createWorks(100, 127, 2025),

    ...createWorks(71, 99, 2024),
    { filename: '79-2', year: '2024', extension: '.jpg' },

    ...createWorks(18, 70, 2023),
    ...createWorks(1, 17, 2022)
];

/*
 * 自然排序：檔名由大到小。
 *
 * 例如：
 * 139 → 138 → ... → 130 → 130-2 → 129
 * ... → 80 → 79 → 79-2 → 78 → ... → 1
 *
 * 第一層先比較檔名中的主數字；主數字相同時，再使用
 * localeCompare + numeric:true 比較完整檔名，確保排序規則
 * 不依賴電腦檔案的修改日期。
 */
function naturalDescendingCompare(a, b) {
    const baseA = Number.parseInt(a.filename.split('-')[0], 10);
    const baseB = Number.parseInt(b.filename.split('-')[0], 10);

    if (baseA !== baseB) {
        return baseB - baseA;
    }

    // 同一主編號時：純數字作品排在差分/連作之後的需求，
    // 例如 130 → 130-2、79 → 79-2。
    const isPlainA = /^\d+$/.test(a.filename);
    const isPlainB = /^\d+$/.test(b.filename);

    if (isPlainA !== isPlainB) {
        return isPlainA ? -1 : 1;
    }

    return b.filename.localeCompare(
        a.filename,
        undefined,
        {
            numeric: true,
            sensitivity: 'base'
        }
    );
}

works.sort(naturalDescendingCompare);

function getGalleryInfo(work) {
    const currentLanguage = localStorage.getItem('lang') || 'zh-TW';

    const info =
        galleryWorkInfoData[currentLanguage]?.[work.filename] ||
        galleryWorkInfoData['zh-TW']?.[work.filename] ||
        {};

    return {
        title: info.title || work.filename,
        description: info.description || '--------'
    };
}

/*
 * 建立作品卡片。
 * 一般作品會自動嘗試 .jpg → .png。
 * 2022 年的 1~9 實際檔名為 01~09，因此也會自動嘗試補零版本。
 * 特殊作品若指定 extension，則直接使用指定副檔名。
 */
function createGalleryItem(work) {
    const button = document.createElement('button');
    button.className = 'gallery-item';
    button.type = 'button';

    const info = getGalleryInfo(work);

    button.dataset.title = info.title;
    button.dataset.description = info.description;
    button.dataset.date = work.year;

    const image = document.createElement('img');
    image.alt = `${info.title} (${work.year})`;
    image.loading = 'lazy';

    const basePath = `./img/art/${work.year}/`;
    const thumbBasePath = `${basePath}thumbs/`;

    // 原圖路徑只儲存在 data-full-images，不會在預覽階段被瀏覽器載入。
    // 預覽圖則一律從 thumbs 資料夾載入，以降低 Gallery 初次載入的流量與記憶體使用量。
    const imagePaths = work.extension
        ? [`${basePath}${work.filename}${work.extension}`]
        : [
            `${basePath}${work.filename}.jpg`,
            `${basePath}${work.filename}.png`,
            ...(work.filename.length < 2
                ? [
                    `${basePath}${work.filename.padStart(2, '0')}.jpg`,
                    `${basePath}${work.filename.padStart(2, '0')}.png`
                ]
                : [])
        ];

    const thumbnailPaths = work.extension
        ? [`${thumbBasePath}${work.filename}${work.extension}`]
        : [
            `${thumbBasePath}${work.filename}.jpg`,
            `${thumbBasePath}${work.filename}.png`,
            ...(work.filename.length < 2
                ? [
                    `${thumbBasePath}${work.filename.padStart(2, '0')}.jpg`,
                    `${thumbBasePath}${work.filename.padStart(2, '0')}.png`
                ]
                : [])
        ];

    // 將完整原圖候選路徑存起來，直到使用者點擊預覽圖才真正設定 galleryImage.src。
    button.dataset.fullImages = JSON.stringify(imagePaths);

    let thumbnailIndex = 0;
    image.src = thumbnailPaths[thumbnailIndex];

    image.addEventListener('error', () => {
        thumbnailIndex += 1;

        if (thumbnailIndex < thumbnailPaths.length) {
            image.src = thumbnailPaths[thumbnailIndex];
        } else {
            const currentLanguage = localStorage.getItem('lang') || 'zh-TW';
            const missingText = i18nData[currentLanguage]?.['image-missing'] || '縮圖不存在';
            image.alt = `${info.title} (${work.year}) — ${missingText}`;
            button.classList.add('image-missing');
        }
    });

    button.appendChild(image);
    galleryGrid.appendChild(button);
}

/* ==========================================================
 * 年份篩選與年份分隔線
 * ----------------------------------------------------------
 * 左側核取方塊可以自由勾選年份。
 * 作品網格會只顯示被勾選的年份，並在每個年份開始前
 * 自動插入年份標題作為視覺分隔。
 * ========================================================== */

const mobileYearFilters = document.getElementById('mobile-year-filters');
const galleryYears = ['2026', '2025', '2024', '2023', '2022'];
const selectedYears = new Set(galleryYears);

function createYearFilter(year) {
    const label = document.createElement('label');
    label.className = 'year-filter-item';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = year;
    checkbox.checked = true;
    checkbox.setAttribute('aria-label', `顯示 ${year} 年作品`);

    const text = document.createElement('span');
    text.textContent = year;

    checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
            selectedYears.add(year);
        } else {
            selectedYears.delete(year);
        }
        renderGallery();
    });

    label.appendChild(checkbox);
    label.appendChild(text);
    mobileYearFilters.appendChild(label);
}

galleryYears.forEach(createYearFilter);

function createYearDivider(year) {
    const divider = document.createElement('div');
    divider.className = 'gallery-year-divider';
    divider.dataset.year = year;
    divider.innerHTML = `<span>${year}</span>`;
    return divider;
}

function renderGallery() {
    galleryGrid.innerHTML = '';

    const visibleWorks = works.filter((work) => selectedYears.has(work.year));

    if (visibleWorks.length === 0) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state gallery-empty-state';
        const currentLanguage = localStorage.getItem('lang') || 'zh-TW';
        const emptyText = i18nData[currentLanguage]?.['gallery-empty'] || '請至少勾選一個年份。';
        emptyState.innerHTML = `<p>${emptyText}</p>`;
        galleryGrid.appendChild(emptyState);
        return;
    }

    let currentYear = '';

    visibleWorks.forEach((work) => {
        if (work.year !== currentYear) {
            galleryGrid.appendChild(createYearDivider(work.year));
            currentYear = work.year;
        }

        createGalleryItem(work);
    });
}

// 按照已排序的 works 建立整個網格。
renderGallery();


/* ==========================================================
 * 畫廊燈箱控制
 * ========================================================== */

const galleryModal = document.getElementById('gallery-lightbox');
const galleryCloseButton = galleryModal.querySelector('.close-btn');
const galleryWrapper = document.getElementById('gallery-img-wrapper');
const galleryImage = document.getElementById('gallery-lightbox-img');
const galleryInfo = document.getElementById('gallery-work-info');
const galleryTitle = document.getElementById('gallery-work-title');
const galleryDescription = document.getElementById('gallery-work-description');
const galleryDate = document.getElementById('gallery-work-date');

let galleryScale = 1;
let galleryOffsetX = 0;
let galleryOffsetY = 0;
let galleryIsDragging = false;
let galleryIsInteractive = false;
let galleryTouchMode = '';
let galleryStartX = 0;
let galleryStartY = 0;
let galleryPinchDistance = 0;
let galleryPinchScale = 1;

// 已成功載入過的原圖會保留在記憶體中。
// 之後再次開啟同一張作品時，直接使用快取，不再經過縮圖 → 原圖的模糊轉場。
const galleryFullImageCache = new Map();

function updateGalleryTransform() {
    if (galleryIsInteractive) {
        galleryWrapper.style.transform =
            `translate(calc(-50% + ${galleryOffsetX}px), calc(-50% + ${galleryOffsetY}px))`;
    } else {
        galleryWrapper.style.transform = '';
    }

    galleryImage.style.transform = `scale(${galleryScale})`;
}

function zoomGalleryAtPoint(nextScale, clientX, clientY) {
    const previousScale = galleryScale;
    const clampedScale = Math.min(Math.max(nextScale, 0.5), 4);
    const pointX = clientX - window.innerWidth / 2;
    const pointY = clientY - window.innerHeight / 2;

    galleryOffsetX =
        pointX - (pointX - galleryOffsetX) * clampedScale / previousScale;

    galleryOffsetY =
        pointY - (pointY - galleryOffsetY) * clampedScale / previousScale;

    galleryScale = clampedScale;
    updateGalleryTransform();
}

function touchDistance(firstTouch, secondTouch) {
    return Math.hypot(
        secondTouch.clientX - firstTouch.clientX,
        secondTouch.clientY - firstTouch.clientY
    );
}

function openGalleryLightbox(item) {
    const itemImage = item.querySelector('img');
    const fullImagePaths = JSON.parse(item.dataset.fullImages || '[]');
    const thumbnailSrc = itemImage.currentSrc || itemImage.src;
    const cacheKey = fullImagePaths[0] || thumbnailSrc;

    galleryImage.alt = itemImage.alt;
    galleryTitle.textContent = item.dataset.title;
    galleryDescription.textContent = item.dataset.description;
    galleryDate.textContent = item.dataset.date;

    // 先重置成「這一張作品自己的縮圖」，避免切換作品時短暫顯示上一張原圖。
    // 第一次開啟時會由縮圖開始，再無縫換成原圖。
    galleryImage.src = thumbnailSrc;
    galleryImage.classList.remove('is-full-loaded');
    galleryImage.classList.add('is-loading-full');

    const cachedImage = galleryFullImageCache.get(cacheKey);

    if (cachedImage) {
        // 這張原圖之前已經完整載入過：直接顯示原圖，不再顯示模糊縮圖。
        galleryImage.src = cachedImage.src;
        galleryImage.classList.remove('is-loading-full');
        galleryImage.classList.add('is-full-loaded');
    } else {
        let fullImageIndex = 0;

        const loadFullImage = () => {
            if (fullImageIndex >= fullImagePaths.length) {
                galleryImage.classList.remove('is-loading-full');
                galleryImage.removeAttribute('src');
                const currentLanguage = localStorage.getItem('lang') || 'zh-TW';
                const missingText = i18nData[currentLanguage]?.['image-not-found'] || '原圖片不存在';
                galleryImage.alt = `${itemImage.alt} — ${missingText}`;
                return;
            }

            const preload = new Image();
            preload.decoding = 'async';
            preload.onload = async () => {
                try {
                    if (typeof preload.decode === 'function') {
                        await preload.decode();
                    }
                } catch (error) {
                    // decode 失敗不代表圖片不能使用，直接採用已完成載入的圖片。
                }

                galleryFullImageCache.set(cacheKey, preload);

                // 只有目前仍然在看同一張作品時才切換，避免快速點擊造成錯圖。
                if (galleryImage.dataset.cacheKey === cacheKey) {
                    galleryImage.src = preload.src;
                    galleryImage.classList.remove('is-loading-full');
                    galleryImage.classList.add('is-full-loaded');
                }
            };
            preload.onerror = () => {
                fullImageIndex += 1;
                loadFullImage();
            };
            preload.src = fullImagePaths[fullImageIndex];
        };

        loadFullImage();
    }

    galleryImage.dataset.cacheKey = cacheKey;

    galleryScale = 1;
    galleryOffsetX = 0;
    galleryOffsetY = 0;
    galleryIsInteractive = false;

    galleryInfo.hidden = false;
    galleryModal.classList.remove('is-interactive');
    galleryModal.classList.remove('zoom-active');

    updateGalleryTransform();

    galleryModal.style.display = 'flex';
    galleryModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
}

function closeGalleryLightbox() {
    galleryModal.style.display = 'none';
    galleryModal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';

    galleryIsDragging = false;
    galleryIsInteractive = false;
    galleryModal.classList.remove('is-interactive', 'zoom-active');
    galleryWrapper.style.transform = '';
}

function returnToGalleryCard() {
    galleryScale = 1;
    galleryOffsetX = 0;
    galleryOffsetY = 0;
    galleryIsDragging = false;
    galleryIsInteractive = false;
    galleryInfo.hidden = false;

    galleryModal.classList.remove('is-interactive');
    galleryModal.classList.remove('zoom-active');

    updateGalleryTransform();
}

function enableGalleryInteraction() {

    if (galleryIsInteractive) {
        return;
    }

    galleryIsInteractive = true;
    galleryInfo.hidden = true;

    galleryModal.classList.add('is-interactive');
    galleryModal.classList.add('zoom-active');

    updateGalleryTransform();

    // card → image
    pushGalleryHistory('image');
}

// 使用事件委派，讓 JavaScript 動態建立的作品卡片也能開啟燈箱。
galleryGrid.addEventListener('click', (event) => {
    const item = event.target.closest('.gallery-item');

    if (!item) {
        return;
    }

    openGalleryLightbox(item);

    // list → card
    pushGalleryHistory('card');
});

galleryCloseButton.addEventListener('click', (event) => {
    event.stopPropagation();

    if (galleryIsInteractive) {
        // image → card
        history.back();
    } else {
        // card → list
        history.back();
    }
});
const galleryPanel = galleryModal.querySelector('.gallery-lightbox-panel');

galleryModal.addEventListener('click', (event) => {

    const clickedOnImage = event.target === galleryImage;
    const clickedInsidePanel = galleryPanel.contains(event.target);

    if (galleryIsInteractive) {

        // 圖片放大狀態：
        // 點圖片以外 → 回到卡片
        if (!clickedOnImage) {
            history.back();
        }

    } else {

        if (clickedOnImage) {

            // 卡片 → 圖片放大
            enableGalleryInteraction();

        } else if (
            event.target === galleryCloseButton ||
            event.target.closest('.close-btn')
        ) {

            // 卡片 → 列表
            history.back();

        } else {

            // 點卡片外背景 → 列表
            history.back();
        }
    }
});

galleryImage.addEventListener('click', (event) => {
    if (!galleryIsInteractive) {
        event.stopPropagation();
        enableGalleryInteraction();
    }
});

galleryModal.addEventListener('wheel', (event) => {
    if (!galleryIsInteractive) {
        return;
    }

    event.preventDefault();

    zoomGalleryAtPoint(
        galleryScale + (event.deltaY < 0 ? 0.1 : -0.1),
        event.clientX,
        event.clientY
    );
}, { passive: false });

galleryWrapper.addEventListener('mousedown', (event) => {
    if (!galleryIsInteractive || event.button !== 0) {
        return;
    }

    galleryIsDragging = true;
    galleryStartX = event.clientX - galleryOffsetX;
    galleryStartY = event.clientY - galleryOffsetY;

    event.preventDefault();
});

document.addEventListener('mousemove', (event) => {
    if (!galleryIsDragging) {
        return;
    }

    galleryOffsetX = event.clientX - galleryStartX;
    galleryOffsetY = event.clientY - galleryStartY;

    updateGalleryTransform();
});

document.addEventListener('mouseup', () => {
    galleryIsDragging = false;
});

galleryWrapper.addEventListener('touchstart', (event) => {
    if (!galleryIsInteractive) {
        return;
    }

    event.preventDefault();

    if (event.touches.length === 2) {
        galleryTouchMode = 'pinch';
        galleryPinchDistance = touchDistance(
            event.touches[0],
            event.touches[1]
        );
        galleryPinchScale = galleryScale;
    } else if (event.touches.length === 1) {
        galleryTouchMode = 'drag';
        galleryStartX = event.touches[0].clientX - galleryOffsetX;
        galleryStartY = event.touches[0].clientY - galleryOffsetY;
    }
}, { passive: false });

galleryWrapper.addEventListener('touchmove', (event) => {
    if (!galleryIsInteractive) {
        return;
    }

    event.preventDefault();

    if (event.touches.length === 2) {
        const currentDistance = touchDistance(
            event.touches[0],
            event.touches[1]
        );

        const centerX =
            (event.touches[0].clientX + event.touches[1].clientX) / 2;

        const centerY =
            (event.touches[0].clientY + event.touches[1].clientY) / 2;

        zoomGalleryAtPoint(
            galleryPinchScale * currentDistance / galleryPinchDistance,
            centerX,
            centerY
        );
    } else if (
        event.touches.length === 1 &&
        galleryTouchMode === 'drag'
    ) {
        galleryOffsetX = event.touches[0].clientX - galleryStartX;
        galleryOffsetY = event.touches[0].clientY - galleryStartY;

        updateGalleryTransform();
    }
}, { passive: false });

galleryWrapper.addEventListener('touchend', (event) => {
    if (event.touches.length === 0) {
        galleryTouchMode = '';
    } else if (event.touches.length === 1) {
        galleryTouchMode = 'drag';
        galleryStartX = event.touches[0].clientX - galleryOffsetX;
        galleryStartY = event.touches[0].clientY - galleryOffsetY;
    }
});

document.addEventListener('keydown', (event) => {
    if (
        event.key === 'Escape' &&
        galleryModal.style.display === 'flex'
    ) {
        // ESC 與手機返回鍵使用完全相同的 History 機制，避免畫面與 History 不同步。
        history.back();
    }
});

function updatePageLanguage(lang) {
    document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.getAttribute('data-i18n');
        if (i18nData[lang] && i18nData[lang][key]) {
            element.textContent = i18nData[lang][key];
        }
    });

    document.documentElement.lang =
        lang === 'ja'
            ? 'ja'
            : lang === 'en'
                ? 'en'
                : 'zh-TW';

    // 作品標題與簡介由 JavaScript 動態建立，因此切換語言後重新渲染 Gallery。
    renderGallery();

    document.documentElement.classList.remove('language-loading');
}
